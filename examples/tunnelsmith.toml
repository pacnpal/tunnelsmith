# Tunnelsmith example configuration.
#
# Every field shown here is optional unless noted. Omitted fields fall
# back to the defaults listed in docs/configuration.md and as // default
# comments in internal/config/config.go.
#
# This file documents the v1 schema. The proxy listeners themselves do
# not start in Phase 1; the binary loads, validates, and (with
# --print-config) reprints the config, then exits.

# --------------------------------------------------------------------
# Listeners. Both default to all-interfaces on standard local ports.
# --------------------------------------------------------------------
[listener]
http  = ":8080"   # HTTP CONNECT and forward proxy
socks = ":1080"   # SOCKS5

# --------------------------------------------------------------------
# Decision cache.
# --------------------------------------------------------------------
[cache]
# How long a successful (host, upstream) decision stays cached.
ttl = "15m"

# How long a host stays in cascade-failure cooldown after every
# upstream has been tried and failed. Phase 4 wires this up.
negative_ttl = "1m"

# Optional file path for persisting the scoreboard across restarts.
# Must be absolute when set. Empty means in-memory only.
# persist_path = "/data/tunnelsmith/decisions.db"

# How often the persistence loop snapshots state to persist_path.
# 0s disables periodic writes; the shutdown flush still runs when
# persist_path is set.
persist_interval = "30s"

# --------------------------------------------------------------------
# Metrics endpoint. Defaults to :9090; empty disables the listener.
# --------------------------------------------------------------------
[metrics]
bind = ":9090"

# --------------------------------------------------------------------
# Web UI (Phase 9). Defaults to :9091; empty disables the listener.
# The UI port is unauthenticated, bind it to a private interface only.
# See docs/ui.md for the endpoint reference and the security stance.
# --------------------------------------------------------------------
[ui]
bind = ":9091"

# --------------------------------------------------------------------
# Cooperative-reporting endpoint (Phase 11). Defaults to :9092; empty
# disables the listener entirely. The control port is unauthenticated;
# bind it to a private interface only. Apps integrate via the wire
# protocol documented in docs/cooperative-reporting.md or the Go SDK
# at github.com/pacnpal/tunnelsmith/client. The endpoint exposes
# POST /v1/report (submit per-request outcomes) and GET /healthz.
# --------------------------------------------------------------------
[control]
bind = ":9092"

# Phase 12: optional bearer-token auth on POST /v1/report. Empty/omitted
# = no auth, byte-for-byte Phase 11 behaviour. When set, every report
# must carry `Authorization: Bearer <token>`; misconfigured clients see
# 401 with `WWW-Authenticate: Bearer realm="tunnelsmith"`, and the
# rejection ticks tunnelsmith_reports_rejected_total{reason="auth_missing"}
# or {reason="auth_failed"}. SIGHUP re-reads both the inline list and
# the file so tokens rotate without a restart. Tokens travel in
# plaintext on the control listener — TLS is Phase 13. Keep the listener
# on loopback or a private subnet.
# auth_tokens = [
#     "replace-me-with-a-long-random-string",
#     "second-token-for-rotation",
# ]
# auth_tokens_file = "/etc/tunnelsmith/control_tokens"
#
# Set gate_healthz = true to pull /healthz under the same gate. Default
# false keeps liveness probes ungated for orchestrators that cannot
# inject a token.
# gate_healthz = false
#
# 1.2+: opt-in TLS termination on the control listener. Both-or-neither;
# absolute paths; restart-only (SIGHUP does not re-read the cert files,
# matching the bind-path policy). Both empty preserves the Phase 11/12
# plaintext wire shape. See ADR-009 in docs/decisions.md.
# tls_cert_file = "/etc/tunnelsmith/control-cert.pem"
# tls_key_file  = "/etc/tunnelsmith/control-key.pem"

# --------------------------------------------------------------------
# Upstreams. At least one is required. Every upstream needs a unique id.
#
# Tunnelsmith builds a priority pool from these entries and tries them
# in ascending priority order on each request. On hard failure (refused,
# timeout, future scoreboard signals) the next entry is tried, up to
# failure.max_retries_per_request total attempts. Lower priority wins.
#
# A common minimal setup is one fast-failing entry plus "direct" as the
# fallback, which is what deploy/tunnelsmith.example.toml uses to
# exercise the retry path in CI.
# --------------------------------------------------------------------

# kind = "direct" sends traffic out the host's default route. No addr.
[[upstream]]
id       = "direct"
kind     = "direct"
priority = 10

# kind = "socks5" needs an addr in host:port form. The Mullvad SOCKS5
# mesh is reachable from inside any Mullvad WireGuard tunnel.
[[upstream]]
id       = "mullvad-se-got"
kind     = "socks5"
addr     = "se-got-wg-001.relays.mullvad.net:1080"
priority = 20

[[upstream]]
id       = "mullvad-nl-ams"
kind     = "socks5"
addr     = "nl-ams-wg-001.relays.mullvad.net:1080"
priority = 21

# kind = "http" forwards through an HTTP CONNECT proxy. Use this when
# you have a Gluetun container exposing port 8888.
[[upstream]]
id       = "proton-nl"
kind     = "http"
addr     = "gluetun-proton-nl:8888"
priority = 30

# Per-upstream auth (username/password) authenticates against the
# upstream proxy. For kind = "http" the dialer sends
# Proxy-Authorization: Basic base64(user:pass) per RFC 7617 on every
# CONNECT. For kind = "socks5" the SOCKS5 user/password auth method is
# offered. The Webshare expander populates these automatically; an
# operator can also set them on a hand-written [[upstream]].
# [[upstream]]
# id       = "auth-required-proxy"
# kind     = "http"
# addr     = "proxy.example.com:8888"
# username = "alice"
# password = "secret"

# --------------------------------------------------------------------
# [[upstream_pool]] blocks expand at startup into one or more
# synthetic [[upstream]] entries through a registered provider. Two
# providers ship in-tree: "mullvad" (public WireGuard relay list) and
# "webshare" (token-authenticated REST API). Adding a third is a
# fork+PR away — see docs/providers.md.
# --------------------------------------------------------------------

# Mullvad: fans the configured display-name countries out into one
# SOCKS5 upstream per active WireGuard relay. Runs inside a gluetun
# WireGuard tunnel.
# [[upstream_pool]]
# provider   = "mullvad"
# id_prefix  = "mvd"
# priority   = 200
# countries  = ["Sweden", "Netherlands", "Switzerland"]
# refresh    = "12h"
# cache_path = "/data/tunnelsmith/mullvad-cache.json"

# Webshare: paginated proxy list, per-proxy Basic auth, optional
# on-demand IP rotation through the control endpoint (see
# docs/control-api.md). Country filter uses ISO 3166-1 alpha-2 codes
# (this is country_codes, not countries — Mullvad's display names
# would not match Webshare's API).
# [[upstream_pool]]
# provider       = "webshare"
# id_prefix      = "ws"
# priority       = 110
# api_token_file = "/etc/tunnelsmith/webshare.token"
# mode           = "direct"   # or "backbone" for plan.pool_filter = "residential"
# kind           = "http"     # or "socks5"
# country_codes  = ["US", "GB", "DE"]
# refresh        = "1h"
# cache_path     = "/data/tunnelsmith/webshare-cache.json"

# --------------------------------------------------------------------
# Failure detection. Phase 4 starts using these to penalize upstreams.
# --------------------------------------------------------------------
[failure]
# Treat ECONNREFUSED as a hard failure signal. Always on for now.
connection_refused = true

# Per-attempt connect/read timeout in milliseconds.
timeout_ms = 8000

# DEPRECATED: top-level body_regex is parsed for backward compatibility
# but the runtime ignores it. Move patterns into [[rule]].body_regex (see
# bottom of this file for an example).
body_regex = []

# Per-response cap (in KiB) on the body prefix the listener buffers for
# [[rule]].body_regex inspection. Bytes past the cap stream to the client
# without ever being matched. Range: 0 to 1024. Set to 0 to disable body
# inspection regardless of any [[rule]].body_regex entries.
body_buffer_kb = 32

# Cap on per-request retries through the upstream pool. Protects the
# pool from amplifying a real outage into a stampede.
max_retries_per_request = 5

# HTTP status codes that count as failures. Each entry says how much
# score to subtract and how long to cool that upstream down for the
# host. Defaults are filled in for 429, 403, and 451 if omitted.

[[failure.status]]
code              = 429   # rate limited - try a different IP now
penalty           = 4
cooldown          = "120s"
honor_retry_after = true  # use Retry-After header if present

[[failure.status]]
code     = 403   # forbidden - usually a long-lived IP/region block
penalty  = 6
cooldown = "30m"

[[failure.status]]
code     = 451   # legal geo-block - wrong exit country for this host
penalty  = 8
cooldown = "6h"

# --------------------------------------------------------------------
# Scoreboard tuning. These are the per-(host, upstream) scoring knobs
# the Phase 4 router uses. The defaults below match what Tunnelsmith
# applies when this section is omitted entirely; the block is shown
# here so you can see what is configurable. Override individual keys
# without restating the rest of the section.
# --------------------------------------------------------------------
[failure.scoring]
# Penalty subtracted from score on each kind of failure, and the
# (host, upstream) cooldown applied for that kind.
refused_penalty  = 3
refused_cooldown = "30s"
timeout_penalty  = 2
timeout_cooldown = "15s"

# Score climbs by success_weight on each successful dial, capped at
# score_cap. Negative scores are clamped at -score_cap.
success_weight = 1
score_cap      = 10

# Probability of picking a non-top eligible candidate on any given
# Pick so a previously penalized upstream gets a chance to recover.
# Set to 0 to disable probing.
probe_chance = 0.05

# Time decay drifts every entry's score toward zero by decay_step
# every decay_interval. Default takes a +10 capped winner about 100
# minutes to drift to zero with no new traffic.
decay_interval = "5m"
decay_step     = 0.5

# Cascade cooling: if every upstream fails for a host on the same
# request, the host is held in negative TTL for cascade_ttl so
# subsequent requests fail fast instead of burning through the pool
# again. A single success clears it early.
cascade_ttl = "30s"

# Failure debounce: identical (host, upstream, kind) failures arriving
# within debounce_window collapse into one penalty event. Stops
# concurrent client requests from over-penalizing one rate-limit event.
debounce_window = "100ms"

# Body-match policy. Phase 8 fires KindBodyMatch when a [[rule]].body_regex
# pattern matches the buffered prefix of a plain-HTTP response. The default
# penalty (5) sits between timeout (2) and forbidden (6); the cooldown (60s)
# is short enough to retry quickly when the match was a transient challenge
# page and long enough to skip a host that consistently serves the pattern
# from this exit.
body_match_penalty  = 5
body_match_cooldown = "60s"

# The persistence-tick prune pass drops entries with score == 0 and
# lastSeen older than prune_after. 0s disables entry pruning; expired
# cascade entries and stale debounce keys are still evicted.
prune_after = "24h"

# --------------------------------------------------------------------
# Per-host rules. Optional. Phase 8 enables them in the router.
# host_glob uses path.Match semantics: "*" matches any sequence of
# non-"/" characters. Hostnames have no "/", so "*" can span multiple
# dot-separated labels: "*.bbc.co.uk" matches both "news.bbc.co.uk"
# and "a.b.bbc.co.uk".
# --------------------------------------------------------------------
[[rule]]
host_glob = "*.itch.io"
prefer    = ["direct", "mullvad-se-got"]

[[rule]]
host_glob = "*.bbc.co.uk"
prefer    = ["mullvad-nl-ams"]
force     = true   # do not fall back to other upstreams on failure

# Body-regex example: pages that return HTTP 200 with a "not available in
# your region" message. Each pattern is a Go regular expression compiled at
# startup; an invalid pattern aborts the load. Inspection runs only on the
# plain-HTTP forward path and only when Content-Encoding is empty or
# "identity" (gzip / br / deflate bodies skip inspection by design).
[[rule]]
host_glob  = "*.example-streamer.com"
prefer     = ["mullvad-nl-ams", "mullvad-se-got"]
body_regex = [
    "(?i)content is not available in your region",
    "(?i)this video is not available in your country",
]
