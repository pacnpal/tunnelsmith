# Minimal Tunnelsmith stack used by CI to exercise the priority pool.
# The mounted config has two upstreams: an unreachable SOCKS5 entry at
# priority 10 (always refuses) and "direct" at priority 20. Every curl
# below succeeds only because the pool retries through "direct" after
# the first upstream fails, so a green CI run is end-to-end proof of
# the Phase 3 retry path.
#
# Bring it up (in CI; do not run on a developer host per ADR-001):
#   docker compose -f deploy/docker-compose.example.yml up -d
#
# Then through the HTTP CONNECT proxy:
#   curl --proxy http://localhost:8080 https://example.com
#
# Or through SOCKS5:
#   curl --socks5-hostname localhost:1080 https://example.com

services:
  tunnelsmith:
    image: tunnelsmith:ci
    container_name: tunnelsmith
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "1080:1080"
    volumes:
      - ./tunnelsmith.example.toml:/etc/tunnelsmith/config.toml:ro
    command:
      - --config=/etc/tunnelsmith/config.toml
