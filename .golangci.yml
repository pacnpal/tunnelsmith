version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  # Note: gosimple was merged into staticcheck in golangci-lint v2.
  # Enabling staticcheck covers all the checks the build plan asked for.

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pacnpal/tunnelsmith
