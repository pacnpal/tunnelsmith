name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GO_VERSION: "1.23"
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: go test
        run: go test ./... -count=1 -race

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: make build
        run: make build
      - name: print version
        run: ./bin/tunnelsmith --version
      - name: print resolved config from example
        run: ./bin/tunnelsmith --config examples/tunnelsmith.toml --print-config

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: tunnelsmith:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
      - name: run image and print version
        run: docker run --rm tunnelsmith:ci --version

      - name: integration - bring up compose stack
        run: docker compose -f deploy/docker-compose.example.yml up -d

      - name: integration - wait for listeners
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null \
              && (echo > /dev/tcp/127.0.0.1/1080) 2>/dev/null; then
              echo "listeners up after ${i} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "listeners did not come up in 30s" >&2
          docker compose -f deploy/docker-compose.example.yml logs tunnelsmith
          exit 1

      - name: integration - HTTP CONNECT proxy works
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            --proxy http://127.0.0.1:8080 https://example.com -o /dev/null

      - name: integration - SOCKS5 proxy works
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            --socks5-hostname 127.0.0.1:1080 https://example.com -o /dev/null

      - name: integration - tunnelsmith logs (always)
        if: always()
        run: docker compose -f deploy/docker-compose.example.yml logs tunnelsmith

      - name: integration - tear down
        if: always()
        run: docker compose -f deploy/docker-compose.example.yml down --volumes

      - name: validate mullvad compose syntax
        run: docker compose -f deploy/docker-compose.mullvad.yml --env-file deploy/.env.example config --quiet

  mullvad-integration:
    name: mullvad-integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: docker
    env:
      MULLVAD_WIREGUARD_PRIVATE_KEY: ${{ secrets.MULLVAD_WIREGUARD_PRIVATE_KEY }}
      MULLVAD_WIREGUARD_ADDRESSES: ${{ secrets.MULLVAD_WIREGUARD_ADDRESSES }}
    steps:
      - name: check secrets
        id: secrets
        run: |
          if [ -z "$MULLVAD_WIREGUARD_PRIVATE_KEY" ] || [ -z "$MULLVAD_WIREGUARD_ADDRESSES" ]; then
            echo "::notice::[skip-ok] mullvad-integration: MULLVAD_WIREGUARD_PRIVATE_KEY and MULLVAD_WIREGUARD_ADDRESSES not set as repo secrets; integration suite needs both per ADR-003"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.secrets.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v4
        if: steps.secrets.outputs.skip == 'false'

      - name: build image
        if: steps.secrets.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: tunnelsmith:mullvad-ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}

      - name: bring up stack
        if: steps.secrets.outputs.skip == 'false'
        env:
          TUNNELSMITH_IMAGE: tunnelsmith:mullvad-ci
        run: docker compose -f deploy/docker-compose.mullvad.yml up -d

      - name: verify three countries
        if: steps.secrets.outputs.skip == 'false'
        timeout-minutes: 10
        env:
          VERIFY_COUNTRIES: Sweden,Netherlands,USA
        run: scripts/verify-mullvad.sh

      - name: gluetun logs (always)
        if: always() && steps.secrets.outputs.skip == 'false'
        run: docker compose -f deploy/docker-compose.mullvad.yml logs gluetun | tail -100

      - name: tunnelsmith logs (always)
        if: always() && steps.secrets.outputs.skip == 'false'
        run: docker compose -f deploy/docker-compose.mullvad.yml logs tunnelsmith

      - name: tear down (always)
        if: always() && steps.secrets.outputs.skip == 'false'
        run: docker compose -f deploy/docker-compose.mullvad.yml down --volumes --remove-orphans
