# Tunnelsmith example configuration.
#
# Every field shown here is optional unless noted. Omitted fields fall
# back to the defaults listed in docs/configuration.md and as // default
# comments in internal/config/config.go.
#
# This file documents the v1 schema. The proxy listeners themselves do
# not start in Phase 1; the binary loads, validates, and (with
# --print-config) reprints the config, then exits.

# --------------------------------------------------------------------
# Listeners. Both default to all-interfaces on standard local ports.
# --------------------------------------------------------------------
[listener]
http  = ":8080"   # HTTP CONNECT and forward proxy
socks = ":1080"   # SOCKS5

# --------------------------------------------------------------------
# Decision cache.
# --------------------------------------------------------------------
[cache]
# How long a successful (host, upstream) decision stays cached.
ttl = "15m"

# How long a host stays in cascade-failure cooldown after every
# upstream has been tried and failed. Phase 4 wires this up.
negative_ttl = "1m"

# Optional file path for persisting the scoreboard across restarts.
# Must be absolute when set. Empty means in-memory only.
# persist_path = "/data/tunnelsmith/decisions.db"

# How often the persistence loop snapshots state to persist_path.
# 0s disables periodic writes; the shutdown flush still runs when
# persist_path is set.
persist_interval = "30s"

# --------------------------------------------------------------------
# Metrics endpoint. Defaults to :9090; empty disables the listener.
# --------------------------------------------------------------------
[metrics]
bind = ":9090"

# --------------------------------------------------------------------
# Upstreams. At least one is required. Every upstream needs a unique id.
#
# Tunnelsmith builds a priority pool from these entries and tries them
# in ascending priority order on each request. On hard failure (refused,
# timeout, future scoreboard signals) the next entry is tried, up to
# failure.max_retries_per_request total attempts. Lower priority wins.
#
# A common minimal setup is one fast-failing entry plus "direct" as the
# fallback, which is what deploy/tunnelsmith.example.toml uses to
# exercise the retry path in CI.
# --------------------------------------------------------------------

# kind = "direct" sends traffic out the host's default route. No addr.
[[upstream]]
id       = "direct"
kind     = "direct"
priority = 10

# kind = "socks5" needs an addr in host:port form. The Mullvad SOCKS5
# mesh is reachable from inside any Mullvad WireGuard tunnel.
[[upstream]]
id       = "mullvad-se-got"
kind     = "socks5"
addr     = "se-got-wg-001.relays.mullvad.net:1080"
priority = 20

[[upstream]]
id       = "mullvad-nl-ams"
kind     = "socks5"
addr     = "nl-ams-wg-001.relays.mullvad.net:1080"
priority = 21

# kind = "http" forwards through an HTTP CONNECT proxy. Use this when
# you have a Gluetun container exposing port 8888.
[[upstream]]
id       = "proton-nl"
kind     = "http"
addr     = "gluetun-proton-nl:8888"
priority = 30

# --------------------------------------------------------------------
# Failure detection. Phase 4 starts using these to penalize upstreams.
# --------------------------------------------------------------------
[failure]
# Treat ECONNREFUSED as a hard failure signal. Always on for now.
connection_refused = true

# Per-attempt connect/read timeout in milliseconds.
timeout_ms = 8000

# Body-regex matches indicate a "your region is blocked" page that
# returns HTTP 200. Phase 8 enables this end to end.
body_regex = ["content.?not.?available.?in.?your.?region"]

# Cap on per-request retries through the upstream pool. Protects the
# pool from amplifying a real outage into a stampede.
max_retries_per_request = 5

# HTTP status codes that count as failures. Each entry says how much
# score to subtract and how long to cool that upstream down for the
# host. Defaults are filled in for 429, 403, and 451 if omitted.

[[failure.status]]
code              = 429   # rate limited - try a different IP now
penalty           = 4
cooldown          = "120s"
honor_retry_after = true  # use Retry-After header if present

[[failure.status]]
code     = 403   # forbidden - usually a long-lived IP/region block
penalty  = 6
cooldown = "30m"

[[failure.status]]
code     = 451   # legal geo-block - wrong exit country for this host
penalty  = 8
cooldown = "6h"

# --------------------------------------------------------------------
# Scoreboard tuning. These are the per-(host, upstream) scoring knobs
# the Phase 4 router uses. The defaults below match what Tunnelsmith
# applies when this section is omitted entirely; the block is shown
# here so you can see what is configurable. Override individual keys
# without restating the rest of the section.
# --------------------------------------------------------------------
[failure.scoring]
# Penalty subtracted from score on each kind of failure, and the
# (host, upstream) cooldown applied for that kind.
refused_penalty  = 3
refused_cooldown = "30s"
timeout_penalty  = 2
timeout_cooldown = "15s"

# Score climbs by success_weight on each successful dial, capped at
# score_cap. Negative scores are clamped at -score_cap.
success_weight = 1
score_cap      = 10

# Probability of picking a non-top eligible candidate on any given
# Pick so a previously penalized upstream gets a chance to recover.
# Set to 0 to disable probing.
probe_chance = 0.05

# Time decay drifts every entry's score toward zero by decay_step
# every decay_interval. Default takes a +10 capped winner about 100
# minutes to drift to zero with no new traffic.
decay_interval = "5m"
decay_step     = 0.5

# Cascade cooling: if every upstream fails for a host on the same
# request, the host is held in negative TTL for cascade_ttl so
# subsequent requests fail fast instead of burning through the pool
# again. A single success clears it early.
cascade_ttl = "30s"

# Failure debounce: identical (host, upstream, kind) failures arriving
# within debounce_window collapse into one penalty event. Stops
# concurrent client requests from over-penalizing one rate-limit event.
debounce_window = "100ms"

# The persistence-tick prune pass drops entries with score == 0 and
# lastSeen older than prune_after. 0s disables entry pruning; expired
# cascade entries and stale debounce keys are still evicted.
prune_after = "24h"

# --------------------------------------------------------------------
# Per-host rules. Optional. Phase 8 enables them in the router.
# host_glob uses path.Match semantics: "*" matches any sequence of
# non-"/" characters. Hostnames have no "/", so "*" can span multiple
# dot-separated labels: "*.bbc.co.uk" matches both "news.bbc.co.uk"
# and "a.b.bbc.co.uk".
# --------------------------------------------------------------------
[[rule]]
host_glob = "*.itch.io"
prefer    = ["direct", "mullvad-se-got"]

[[rule]]
host_glob = "*.bbc.co.uk"
prefer    = ["mullvad-nl-ams"]
force     = true   # do not fall back to other upstreams on failure
